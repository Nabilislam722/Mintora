name = "mintora-frontend"
main = "worker/index.js"
compatibility_date = "2026-06-12"

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Pages go through the Worker first so it can add per-page SEO tags; Vite's bundled JS/CSS skip it
run_worker_first = ["/*", "!/assets/*"]
